<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Kassel Batch — Wishes</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"><style>
:root{--bg:#0c0b0a;--panel:#171511;--text:#f0ead8;--muted:#978d7a;--red:#c0392b;--gold:#e8c96a;--line:rgba(240,234,216,.12);--serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 10%,rgba(192,57,43,.16),transparent 26%),radial-gradient(circle at 90% 80%,rgba(232,201,106,.11),transparent 24%),var(--bg);color:var(--text);font:16px/1.6 var(--sans)}.page{max-width:860px;margin:auto;padding:clamp(2rem,7vw,5rem) 1.4rem}.eyebrow{color:var(--red);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase}h1{font:400 clamp(3rem,9vw,6rem)/.9 var(--serif);margin:.75rem 0 1.3rem}h1 em{color:var(--gold)}.intro{max-width:540px;color:var(--muted);font:italic 1.15rem/1.6 var(--serif)}.card{margin-top:3rem;padding:clamp(1.4rem,4vw,2.6rem);border:1px solid var(--line);background:rgba(23,21,17,.86);box-shadow:0 24px 70px rgba(0,0,0,.3)}label{display:block;margin-bottom:.45rem;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.13em}input,select,textarea{width:100%;background:#0e0d0b;border:1px solid var(--line);color:var(--text);padding:.85rem 1rem;font:inherit;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--gold)}textarea{min-height:120px;resize:vertical}button{border:1px solid var(--gold);background:transparent;color:var(--gold);padding:.8rem 1rem;margin-top:1rem;cursor:pointer;text-transform:uppercase;letter-spacing:.12em;font:500 .68rem var(--sans)}button:hover{background:var(--gold);color:#17110b}.error{min-height:1.5em;color:#ec806f;font-size:.82rem;margin:.6rem 0 0}#wall[hidden],#gate[hidden]{display:none}.wall-head{display:flex;justify-content:space-between;align-items:end;gap:1rem;margin-top:3rem}.wall-head h2{font:400 2.4rem var(--serif);margin:0}.logout{border-color:var(--line);color:var(--muted);margin:0}.logout:hover{border-color:var(--red);background:var(--red);color:white}.message{padding:1.3rem 0;border-bottom:1px solid var(--line)}.message:first-child{border-top:1px solid var(--line);margin-top:1.4rem}.message-meta{display:flex;justify-content:space-between;gap:1rem;color:var(--muted);font-size:.72rem}.message-name{color:var(--gold);font:italic 1.3rem var(--serif)}.message p{margin:.65rem 0 0;white-space:pre-wrap}.empty{color:var(--muted);font:italic 1.1rem var(--serif);padding:2rem 0}footer{margin-top:4rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;color:var(--muted);font-size:.72rem}footer a{color:var(--muted);text-decoration:none}footer a:hover{color:var(--gold)}@media(max-width:520px){.wall-head{align-items:start;flex-direction:column}.logout{margin-top:0}}
</style></head><body><main class="page"><span class="eyebrow">Private circle</span><h1>Our <em>Wishes</em></h1><p class="intro">A quiet place for the Kassel Batch to leave a few words, a memory, or a wish for the road ahead.</p>
<section class="card" id="gate"><label for="access-password">Shared password</label><input id="access-password" type="password" autocomplete="current-password" placeholder="Enter the shared password"><button id="unlock" type="button">Enter the wishes wall</button><p class="error" id="access-error" aria-live="polite"></p></section>
<section id="wall" hidden><div class="card"><label for="author">Your name</label><select id="author"><option>Clifford</option><option>Anjitha</option><option>Nandhana</option><option>Varsha</option><option>Justin</option><option>Sandra Sabu</option><option>Sandra Sebastian</option><option>Kripa</option><option>Naveen</option><option>Anu</option><option>Jeffry</option><option>Aleena</option></select><label for="wish" style="margin-top:1.2rem">Your message</label><textarea id="wish" maxlength="700" placeholder="Write a wish, a memory, or a few words for the Kassel Batch…"></textarea><button id="post-wish" type="button">Leave this wish</button><p class="error" id="wish-error" aria-live="polite"></p></div><div class="wall-head"><div><span class="eyebrow">Memory wall</span><h2>Words to keep.</h2></div><button class="logout" id="logout" type="button">Lock page</button></div><div id="messages"></div></section>
<footer><span>Kassel Batch · 2026</span><a href="kassel-farewell.html">← Return to the farewell page</a></footer></main><script>
const PASSWORD_HASH='d2f52c93395a5bda41718d53b0eb37ebb68f4e8f5c73d0e75e79f54a711e4b02',STORE_KEY='kassel-wishes-v1',gate=document.getElementById('gate'),wall=document.getElementById('wall'),password=document.getElementById('access-password'),accessError=document.getElementById('access-error'),messages=document.getElementById('messages');async function hash(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}function wishes(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||[]}catch{return[]}}function render(){const e=wishes();messages.replaceChildren();if(!e.length){const p=document.createElement('p');p.className='empty';p.textContent='No wishes yet. Be the first to leave a few words.';messages.append(p);return}e.slice().reverse().forEach(x=>{const a=document.createElement('article'),m=document.createElement('div'),n=document.createElement('span'),d=document.createElement('span'),p=document.createElement('p');a.className='message';m.className='message-meta';n.className='message-name';n.textContent=x.name;d.textContent=new Date(x.time).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});p.textContent=x.text;m.append(n,d);a.append(m,p);messages.append(a)})}function openWall(){gate.hidden=true;wall.hidden=false;render()}document.getElementById('unlock').addEventListener('click',async()=>{if(await hash(password.value)===PASSWORD_HASH){sessionStorage.setItem('kassel-wishes-access','yes');password.value='';accessError.textContent='';openWall()}else accessError.textContent='That password is not correct.'});password.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('unlock').click()});document.getElementById('post-wish').addEventListener('click',()=>{const text=document.getElementById('wish').value.trim(),error=document.getElementById('wish-error');if(!text){error.textContent='Please write a message first.';return}const all=wishes();all.push({name:document.getElementById('author').value,text,time:Date.now()});localStorage.setItem(STORE_KEY,JSON.stringify(all));document.getElementById('wish').value='';error.textContent='';render()});document.getElementById('logout').addEventListener('click',()=>{sessionStorage.removeItem('kassel-wishes-access');wall.hidden=true;gate.hidden=false;password.focus()});if(sessionStorage.getItem('kassel-wishes-access')==='yes')openWall();
</script></body></html>
